<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
    .box {
        height: 200px;
        width: 200px;
    }
    .one {
        background-color: red;
    }
    .two {
        background-color: green;
    }
    .three {
        background-color: blue;
        transition: transform 2s 300ms ease-in-out, border-radius 2s 300ms ease-in-out, background-color 2s 300ms ease-in-out;
    }
    .parent{
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px solid red;
        margin-left:5px ;
        margin-right:5px ;
    }
    .one:hover {
        transform: rotate(45deg);
        transition: transform 0.5s ease-in-out;
        transform-origin: center;
    }
    .two:hover {
        transform: scale(1.5);
        transition: transform 0.5s ease-in-out;
    }
    .three:hover {
        transform: translateX(-400px);
        transition: transform 0.5s ease-in-out;
        border-radius: 50%;
        background-color: lightblue;
    }
</style>
<body>
    <h2>Transform</h2>
    <div class="parent">
        <div class="box one"></div>
        <div class="box two"></div>
        <div class="box three"></div>
    </div>
    
</body>
</html>
